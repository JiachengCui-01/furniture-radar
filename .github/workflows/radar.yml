name: 家具爆品雷达

on:
  schedule:
    # 每天 UTC 00:17（北京时间 08:17）检查一次；距上次成功运行满 7 天（config.yaml 可改）才真正拉数据
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = 正常运行；rerender = 用已有数据重新生成最近一期报告（不调用卖家精灵，链接不变）"
        type: choice
        options: [run, rerender]
        default: run
      force:
        description: "忽略 3 天间隔，立即运行"
        type: boolean
        default: true
      notify:
        description: "完成后推送钉钉"
        type: boolean
        default: true
      budget:
        description: "本期卖家精灵调用上限（留空用 config.yaml）"
        type: string
        default: ""

# 每个任务只给它要用的权限（以前四个任务都有写权限；推送钉钉、发告警的任务也会装依赖、跑代码）。
# 第三方 action 固定到具体的提交（# 后面是对应的版本号），不跟着标签变
permissions: {}

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 把加密数据和报告推到 site 分支
      actions: write    # 保活：防止 60 天无活动后定时任务被停用
    timeout-minutes: 240  # 每期最多约 1,500 次调用，每次约 1.5 秒，加上限流等待和主图识别约 40~60 分钟
    outputs:
      published: ${{ steps.run.outputs.published }}
      saved: ${{ steps.run.outputs.saved }}
      reason: ${{ steps.run.outputs.reason }}
      report_id: ${{ steps.run.outputs.report_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 取回历史数据（site 分支，已加密）
        id: fetch
        run: |
          # 只有“site 分支确实不存在”（ls-remote 返回 2）才当首次运行；网络 / 权限出错（返回 128）时重试，还不行就失败，
          # 不能当成首次运行从空数据开始、再强制推送把历史数据和往期报告全覆盖掉
          mkdir -p site
          for i in 1 2 3; do
            code=0
            git ls-remote --exit-code --heads origin site >/dev/null 2>&1 || code=$?
            if [ "$code" = 0 ] || [ "$code" = 2 ]; then break; fi
            sleep 10
          done
          if [ "$code" = 0 ]; then
            git fetch --quiet --depth 1 origin site
            git archive FETCH_HEAD | tar -x -C site
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          elif [ "$code" = 2 ]; then
            echo "site 分支还不存在：首次运行"
            echo "sha=" >> "$GITHUB_OUTPUT"
          else
            echo "::error::查不到 site 分支（git ls-remote 返回 $code），本期不运行，免得从空数据开始覆盖历史"
            exit 1
          fi

      - name: 运行雷达
        id: run
        env:
          SELLERSPRITE_SECRET_KEY: ${{ secrets.SELLERSPRITE_SECRET_KEY }}
          REPORT_KEY: ${{ secrets.REPORT_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}
          BUDGET: ${{ github.event_name == 'workflow_dispatch' && inputs.budget || '' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'run' }}
        run: |
          if [ "$MODE" = "rerender" ]; then
            python -m radar rerender --site-dir site --github-output
          else
            python -m radar run --site-dir site --github-output $FORCE ${BUDGET:+--budget "$BUDGET"}
          fi

      - name: 保存到 site 分支（只保留最新一次提交，仓库不会越来越大）
        # 出了报告的保存；核心数据没拉完就中止的（saved=true：账户额度用完 / 卖家精灵一直连不上）也保存已拉到的数据和调用次数
        if: always() && (steps.run.outputs.published == 'true' || steps.run.outputs.saved == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_KEY: ${{ secrets.REPORT_KEY }}
          FETCHED_SHA: ${{ steps.fetch.outputs.sha }}
          MESSAGE: "${{ steps.run.outputs.report_id && format('radar: {0}', steps.run.outputs.report_id) || 'radar: 中止前已拉到的数据' }}"
        run: |
          # GitHub 推送保护偶尔把密文里的一段随机字符认成访问密钥（实测 2026-10-23 被拒过一次）：被拒时换一个随机 IV 重新加密再推。
          # 三次都推不上就让这一步失败（不再部署网站，并触发钉钉失败告警），不能悄悄当成功。
          # 带租约推送：远端 site 分支还是开头取回的那个提交才覆盖（首次运行要求远端还没有 site 分支），
          # 中间被别的运行改过就失败，不会把别人的数据覆盖掉
          for i in 1 2 3; do
            rm -rf site/.git
            git -C site init -q -b site
            git -C site add -A
            git -C site -c user.name="radar-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "$MESSAGE"
            if git -C site push -q --force-with-lease="site:${FETCHED_SHA}" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site:site; then
              rm -rf site/.git
              exit 0
            fi
            python -m radar reseal --site-dir site
            sleep 5
          done
          rm -rf site/.git
          echo "::error::三次都没能推送到 site 分支，本期数据没有保存"
          exit 1

      - name: 准备网站文件（不包含 data/）
        if: steps.run.outputs.published == 'true'
        run: |
          mkdir -p _pages
          cp -r site/. _pages/
          rm -rf _pages/data

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5
        if: steps.run.outputs.published == 'true'
        with:
          path: _pages

      - name: 保活
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/radar.yml/enable" || true

  deploy:
    needs: radar
    if: needs.radar.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # 部署 GitHub Pages
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5

  notify:
    needs: [radar, deploy]
    if: needs.radar.outputs.published == 'true' && (github.event_name == 'schedule' || inputs.notify)
    runs-on: ubuntu-latest
    permissions:
      contents: read    # 取代码和 site 分支
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 取回最新数据
        run: |
          mkdir -p site
          git fetch --quiet --depth 1 origin site
          git archive FETCH_HEAD | tar -x -C site
      - name: 推送钉钉
        env:
          REPORT_KEY: ${{ secrets.REPORT_KEY }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # 每个钉钉群一个 Secret：DINGTALK_ROBOT_1 ~ 5（没建的就是空的）。密钥必须逐个写出来，
          # 一次性传入全部密钥的写法会被 GitHub 判为可疑工作流，需要人工批准才能运行。
          DINGTALK_ROBOT_1: ${{ secrets.DINGTALK_ROBOT_1 }}
          DINGTALK_ROBOT_2: ${{ secrets.DINGTALK_ROBOT_2 }}
          DINGTALK_ROBOT_3: ${{ secrets.DINGTALK_ROBOT_3 }}
          DINGTALK_ROBOT_4: ${{ secrets.DINGTALK_ROBOT_4 }}
          DINGTALK_ROBOT_5: ${{ secrets.DINGTALK_ROBOT_5 }}
          REPORT_BASE_URL: ${{ vars.REPORT_BASE_URL || needs.deploy.outputs.page_url }}
        run: python -m radar notify --site-dir site

  alert:
    needs: [radar, deploy, notify]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 钉钉失败告警（不含任何数据）
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          # 每个钉钉群一个 Secret：DINGTALK_ROBOT_1 ~ 5（没建的就是空的）。密钥必须逐个写出来，
          # 一次性传入全部密钥的写法会被 GitHub 判为可疑工作流，需要人工批准才能运行。
          DINGTALK_ROBOT_1: ${{ secrets.DINGTALK_ROBOT_1 }}
          DINGTALK_ROBOT_2: ${{ secrets.DINGTALK_ROBOT_2 }}
          DINGTALK_ROBOT_3: ${{ secrets.DINGTALK_ROBOT_3 }}
          DINGTALK_ROBOT_4: ${{ secrets.DINGTALK_ROBOT_4 }}
          DINGTALK_ROBOT_5: ${{ secrets.DINGTALK_ROBOT_5 }}
          REASON: ${{ needs.radar.outputs.reason }}
        run: |
          python -m radar alert --reason "$REASON" --stage "${{ needs.radar.result != 'success' && '数据采集/分析' || needs.deploy.result != 'success' && '网站部署' || '钉钉推送' }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            ${{ needs.radar.outputs.published == 'true' && '--published' || '' }} ${{ needs.radar.outputs.saved == 'true' && '--saved' || '' }}
