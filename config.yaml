# 家具爆品雷达 配置文件
# 这里只放“非机密”的参数，密钥一律放环境变量 / GitHub Secrets（见 .env.example）。
# 没写的项会使用 radar/config.py 里的默认值。

marketplace: US
vendor_timezone: America/Los_Angeles   # 卖家精灵按美国时间结算月份
display_timezone: Asia/Shanghai        # 报告里显示的时间

# ---------------- 监控范围 ----------------
# 只看板材 / 实木 / 铁木为主的柜类、桌类、床架、置物架；
# 剔除沙发、床垫、脚凳、各类椅子、天篷、屏风、塑料折叠桌，以及软包 / 布艺抽屉 / 塑料商品。
scope:
  # 根类目：会自动展开出子类目，并在每个子类目里取头部商品
  roots:
    - path: "1055398:1063306"        # Home & Kitchen > Furniture
      label: 家具
    - path: "1064954:1069102"        # Office Products > Office Furniture & Lighting（书桌、置物架、文件柜等）
      label: 办公家具
  rollup_pages: 2                    # 子类目按销售额取前 N×50 个（范围收窄后需要看得更深）
  min_node_products: 800             # 子类目商品数低于此值不单独追踪
  max_nodes: 30                      # 最多追踪多少个子类目
  # 子类目自己的英文名（最后一级）要匹配“保留”且不匹配“剔除”才会追踪
  include_label_regex: '(?i)\bbeds?\b|bed frames?|headboard|desk|workstation|dresser|\bchests?\b|bookcase|shel(f|ves|ving)|nightstand|night stand|tables?\b|console|\btv\b|media|entertainment|cabinet|storage|pantr|buffet|sideboard|credenza|hutch|vanit|bench|rack|island|armoire|wardrobe|shoe|hall tree|filing|etagere'
  exclude_label_regex: '(?i)sofas|couch|loveseat|sectional|futon|mattress|box spring|ottoman|bean bag|chair|stool|recliner|seating|canop|gazebo|pergola|tent|divider|screen|folding|adjustable base|massage|inflatable|air bed|light|lamp|umbrella|cushion|pillow|cover|replacement|parts|hardware|decor|cart|display|laborator|science'
  # 商品标题匹配下面的词直接剔除（软包、布艺抽屉、塑料等）。布艺抽屉也认“fabric closet / file / organizer drawers”“fabric chests”
  # （11-01 彩排里爆火第 1 是标题写“Wide Fabric Closet Chests”的布艺抽屉柜，带布艺文件抽屉的书桌也漏过）
  exclude_product_regex: '(?i)upholster|tufted headboard|fabric (?:closet |file |organizer )?(?:drawers?|bins?|storage|dressers?|chests?)|\bplastic\b|\bresin\b|folding bed|rollaway|mattress set|& mattress|with (?:memory foam |foam |a )?mattress\b'
  # 软包的床 / 床头板 / 长凳 / 椅凳：标题里有皮革、丝绒、泰迪绒等面料，而且是床、床头板、长凳、椅凳。
  # 只是表面贴皮的柜子（PU 皮面五斗柜、皮面床头柜）不算。回测（已知的 4,392 个商品标题）：剔除 25 个，都是软包床 / 床头板 / 软包长凳
  upholstered_material_regex: '(?i)\b(?:faux|pu|vegan|synthetic) leather\b|\bleatherette\b|\bvelvet\b|\bboucl[eé]|\bsherpa\b|\bchenille\b'
  upholstered_item_regex: '(?i)\b(?:beds?|bed frames?|headboards?|bench(?:es)?|banquettes?|chairs?|stools?|ottomans?)\b'
  # 配件不是家具：升降台（桌面上的站立办公增高架）、显示器增高架、电视支架腿 / 壁挂架、储物柜隔板。
  # 配件词出现在任何家具名词之前才算（“带显示器架的电脑桌”是桌子，不剔除）。回测：剔除 27 个，没有误剔。
  # 后来加的（不在监控范围的品类，同样出现在任何家具名词之前才剔除）：收纳凳（storage ottoman）、化妆椅 / 化妆凳、电视 / 显示器顶上的置物架、
  # 支架（mount bracket）、可叠 / 可折叠收纳箱、户外 / 庭院家具；“vanity chair / stool”不算梳妆台，“island”算家具名词。
  # 回测（11-01 彩排全市场名单 3,422 个标题）：多剔除 21 个，都是上面这几类，没有多放进来的
  accessory_regex: '(?i)desk (?:converter|riser)|monitor (?:stand )?riser|laptop stand|tv stand legs|\btv legs\b|tabletop tv stand|\btv (?:wall )?mounts?\b|locker (?:organizer )?shel(?:f|ves)|\bottomans?\b|\b(?:vanity|makeup) (?:chairs?|stools?)\b|\b(?:tv|monitor|computer) (?:screen )?top (?:shelf|shelves|storage)\b|\bmount bracket\b|\b(?:stackable|foldable|collapsible) (?:storage )?(?:bins?|cubes?)\b|\boutdoor\b|\bpatio\b'
  furniture_noun_regex: '(?i)\b(?:desk(?! converter| riser| organizer)|table|nightstand|dresser|cabinet|bookcase|bookshelf|tv stand(?! legs)|console|bench|bed|wardrobe|armoire|sideboard|buffet|hutch|vanity(?! chairs?| stools?)|island|chest|credenza|shelving unit|etagere)\b'
  # 额外固定追踪的类目（用 python -m radar search-category 关键词 查 nodeIdPath）
  extra_nodes: []
  #  - path: "1055398:1063306:1063318:3733551"
  #    label: 沙发

# ---------------- 发现 ----------------
# 卖家精灵的商品榜单有两种：传月份 = 已结束月份的月末快照（月度名单，每月查一次）；
# 不传月份 = 截至当天的近 30 天数据（近 30 天榜单，每期刷新）。
discovery:
  top_per_node: 50                   # 每个子类目取多少个头部商品
  order_field: total_amount          # 头部排序字段（total_amount=销售额）
  merge_variations: true             # 同一父体只取一条（不合并时头部 50 名常常只有 1~5 个不同商品）
  newcomer_max_nodes: 12             # 在销量最大的 N 个子类目里额外查新品
  newcomers_per_node: 30
  newcomer_min_revenue: 20000        # 新品月销售额门槛（美元，近 30 天新品榜也用它）
  # 卖家精灵的上月名单在月初还没更新完：实测 10-09 拉的 9 月名单里约两成商品的 9 月销量还是 8 月的数（衣帽架 31 个），
  # 10-22 再拉全部更新、和日数据接口一致。所以月份结束后不到 N 天拉的名单，过了 N 天重新拉一次（约 45 次调用，每月一次；
  # 第 9 天还没更新完、第 22 天已更新，取 20）。子类目门槛、机会候选、开发方向的头部商品、持续热销补判都用重拉后的
  settle_days: 20
  # 根类目的近 30 天榜单：每个根类目按“销量增长率”“近 7 天 BSR 增长率”各取前 N，再按上架时间倒序取销售额达标的新品。
  # 默认关闭（0）：全市场名单（radar/universe.py，见下面 pool）已经把全部子类目里量够的商品都翻了一遍；
  # 这两个榜单是根类目一级的，一次 50 个里只有约 1/6 在监控范围内，名单里的增长率字段也和日数据对不上
  risers_per_root: 0                 # 0 = 关闭
  risers_new_per_root: 0             # 新品榜，0 = 关闭
  # 量的门槛（过滤小基数的排名跳动）：近 30 天销量 ≥ risers_min_units 或销售额 ≥ risers_min_revenue，满足一个就行。
  # 接口的条件是“且”，所以两个门槛各查一次（每个排序 × 每个根类目多 1 次调用）。只按件数时卖得贵的商品进不了榜
  risers_min_units: 300
  risers_min_revenue: 40000
  risers_orders: [total_units_growth, bsr_rank_cr]
  risers_max_prev_bsr: 1000000       # 之前 BSR 高于此值的多为断货恢复，剔除
  # 相似款：上期爆火/潜力商品里取前 N 个作种子，查同类竞品（每个 1 次调用，返回约 15 个近 30 天数据的商品）。
  # 默认关闭（0）：量够的同类竞品都在全市场名单里
  similar_seeds: 0
  similar_size: 20
  similar_cooldown_runs: 3           # 同一种子 N 期内不重复查；查到的相似款保留 N 期作为候选

# ---------------- 追踪池（每个商品每期 1 次调用拉日数据） ----------------
# 按顺序填满：必看 → 机会候选（全市场名单初筛出来的，全部都看）。同一父体只取一个，评分不达标的不占名额，由后面的依次补位。
# 池子大小还会受本期剩余预算限制。
pool:
  max_size: 3000                     # 头一个月初筛出来的多（约 1700~2400 个），之后约 1250 个
  # 必看 = 往期上榜的（近 watch_runs 期被标为爆火/潜力/异常的，最多 watch_max 个，最近一期的在前）+ 子类目头部（core_max 个）。
  # 两份名额分开：全市场名单以后每期约 90 个爆火/潜力/异常，三期就有一两百个，以前和头部共用 100 个名额时
  # （11-01 彩排的下一期：往期上榜的 115 个）头部一个都排不进来，超出的往期上榜商品要靠初筛和预算排序，冷下来的拉不到日数据，
  # 在“与上期对比”里直接消失，不会出现在“不再爆火”里。往期上榜的 115 个里 83 个本来就会被初筛选上，单独给名额实际多出约 30 个
  watch_runs: 3
  watch_max: 300
  # 头部名额 60：29 个子类目各取月销量第一、月销售额第一最多 58 个。以前 100 个里剩下的按月销量从全部子类目补大卖家，
  # 现在头部有月度名单补判（不拉日数据也判持续热销），不用占日数据名额
  core_max: 60                       # 子类目头部必看名额：每个子类目月销量前 N、月销售额前 N，
  per_node_top: 1                    #   还有剩就按月销量从全部子类目里补（持续热销板块的大卖家不会漏）
  per_node_top_revenue: 1            #   只按件数挑会偏向便宜货（实测件数第一的价格中位数 $65，销售额第一的 $130）
  similar_max: 10                    # 相似款名额
  # 机会候选 = 全市场名单（radar/universe.py）：每期把全部子类目里近 30 天量够的商品翻一遍（每 50 个 1 次调用，约 130 次），
  # 存下每个商品的近 30 天销量，用自己存的往期名单算增长，只给可能达标的商品拉日数据。
  # 量够：近 30 天销量 ≥ opportunity_min_units 或销售额 ≥ opportunity_min_revenue（美元），满足一个就行
  # （只看件数时，卖得贵的商品几乎都进不来：实测被件数门槛挡掉的一半价格中位数 $250）。
  # 突然爆火、潜力、上升中都只在这些商品里找；量不够的不拉日数据，报告里各板块说明写明这个范围
  opportunity_min_units: 300
  opportunity_min_revenue: 40000
  # 初筛（universe.screen）：稳定以后（有约 screen_base_days 天前自己存的快照）= 比那份 ≥ screen_growth、半年内上架且没跌、
  # 近 screen_short_days 天（每周一期：7 / 14 天）比那几天前那份的日均 ≥ screen_short 倍，满足一个就拉日数据；新进名单（没有基准）的都拉。
  # 头一个月没有 28 天前的快照：基准用上个月的月度名单（同样的门槛翻全，结束于 21~47 天前）或 21~47 天前自己存的快照，
  # 增长门槛按基准有几天前取 screen_ladder（[最多几天, 门槛]）；基准是月度名单时再加上名单的近 7 天 BSR 改善 ≥ screen_bsr_cr%。
  # 快照和基准按父体对（名单每次给出的“代表子体”常常不一样：相邻两个月 29%~39% 的父体换了；按 ASIN 对时换了的都成了新进名单抢先拉）。
  # 回测（2026-10-23 全覆盖试跑里门槛以上、拉到日数据的约 2,000 个——每个子类目随机的一半，门槛以上一共约 3,800 个；
  # 自己存的快照按“最近 9 天之后会被下调”还原）：初筛不限预算时召回 99%~100%，稳定以后要拉约 36%~42%、头一个月 47%~59%。
  # 预算只够拉一部分时按增长幅度从大到小拉，召回看预算够拉全市场的几成：两成 76%~78%、两成五 90%~92%、三成 96%~98%
  screen_base_days: 28
  screen_short_days: [7, 14]
  screen_growth: 0.15
  screen_short: 1.3
  screen_bsr_cr: 20
  screen_ladder: [[23, 0.10], [36, 0.15], [47, 0.10]]
  # 下面三项只在全市场名单没翻成（预算不够）时用：月度名单和近 30 天榜单里挑，分数最高的 N 个每期都看，其余按最久没查轮流
  opportunity_every_run: 20
  opportunity_min_growth: 20         # 月度名单里：销量增长 ≥ N%（本月 ÷ 上月，用自己存的往月名单算；上月不在名单里才用卖家精灵的 unitsGr 字段，
                                     #   它有两成是 0 或空的，和日数据接口比误差中位数 5.9%，自己算的 2.6%）
  # 或近 30 天在往上走：近 30 天名单的日均 ≥ 近 6 个月名单日均的 N 倍（和“上升中”同一个倍数）。没有日数据就判不了上升中，
  # 补判的持续热销里有 14 个近 30 天比半年平均高 1.3 倍以上（例：衣帽架 ×2.4），靠它进追踪池拉日数据
  opportunity_head_rising: 1.3
  opportunity_max_age_days: 180      # 上架不超过 N 天的算“半年内上架”（初筛和上面的退回办法都用）
  # 早期名单：全市场名单的门槛是近 30 天合计，刚爆起来的新品要攒够才进得来。回测（2025-11~2026-09 每周回放）：约三分之一的
  # 突然爆火开始时还不够门槛，中位数晚 7 天（2~3 期）才进全市场名单，其中八成上架不到半年。打开后每个子类目再翻一份
  # 上架 ≤ max_age_months 个月、近 30 天 ≥ min_units 件或 ≥ min_revenue 美元（但不够全市场门槛）的商品，
  # 近 7 天 BSR 改善 ≥ bsr_cr% 的拉日数据（排在全市场初筛之后）。回测：能提前约 6 天抓到其中 46 个突然爆火，
  # 每期约多 300 次调用（翻名单约 45 次 + 日数据约 250 次）。默认关闭：每月 7,000 次的预算放不下
  young:
    enabled: false
    max_age_months: 6
    min_units: 100
    min_revenue: 15000
    bsr_cr: 50

# ---------------- 卖家精灵调用预算 ----------------
# 2026-10 起每周一期：卖家精灵 MCP 套餐按自然月给调用次数（最大的月付套餐 1 万次 / 月，每月 1 号 0 点重置，用不完不结转），
# 和 AI工作台 共用一个 key。按套餐 1 万、给 AI工作台 留 3,000 算，雷达每月最多 7,000 次。
# 每 3 天一期全覆盖要约 1.6 万次 / 月，放不下；每天回放（2025-11~2026-09）：每周一期能看到 92% 的增长商品（每 3 天一期 98%），
# 持续 ≥7 天的增长一个不漏，平均晚 2.3 天看到（每 3 天一期 0.9 天）
# 按现在的门槛（近 30 天 ≥300 件或 ≥4 万美元，约 3,800 个商品）全覆盖每期要约 2,000~2,500 次：全市场名单约 130 + 初筛出来的拉日数据
# 约 1,400~2,200 + 必看约 100 + 小子类目的近 30 天名单约 12 + 核查 40 + 材质最多 100，每月 7,000 次放不下，初筛出来的按增长幅度从大到小拉。
# 按本月剩下几期平均分（split: even）：11 月 5 期每期约 1,400（初筛的日数据约 860~1,020，够拉全市场的 22%~27%，召回约 85%~93%）；
# 12 月 4 期每期约 1,750（约 36%，召回约 99%）。以前每期固定 1,300 / 1,500：11 月头几期花满，最后一期（11-29，黑五那周）只剩约 1,200（召回约 80%）
# 卖家精灵账户有调用次数上限（2026-10-23 一天约 1 万次后返回“接口访问次数已达上限”，和 AI工作台 共用）：
# 碰到时，名单和日数据还没拉完的那一期不出报告（钉钉失败告警），拉完之后才碰到的跳过补充查询、照常出报告
budget:
  split: even                        # even = 每期预算 = 本月剩下的额度 ÷ 本月还剩几期（含这一期，按 min_days_between_runs 算）；fixed = 用下面两项
  max_per_run: 2500                  # even 时每期最多这么多（工作流超时 240 分钟，2,500 次约 1 小时）
  per_run: 1300                      # fixed 时每期调用上限
  bootstrap_run: 1500                # fixed 时：需要重新发现子类目（每月初 / 月初名单过 20 天重拉，约 75 次）或要翻上个月的全市场月度名单当基准（约 130 次）的那一期
  monthly_cap: 7000                  # 每月总上限（每周一期，一个月 4~5 期）；套餐 1 万 / 月，给 AI工作台 留 3,000
  quota_timezone: Asia/Shanghai      # 上面的“每月”按北京时间的自然月算（卖家精灵套餐次数每月 1 号 0 点重置）
  review_checks: 40                  # 每期评论核查的个数上限（每个 1 次调用；14 天内核查过的不重复），先后：① 可疑的上榜商品；
                                     #   ② 报告点名的（本期要点、钉钉里的爆火 / 潜力各前 6 个，前几个开发方向的参考商品候选）；
                                     #   ③ 不在榜单上、异常分 ≥2 的；④ 其余爆火、潜力；⑤ 按“可能是 Vine”扣过才不够的新品。名额不够时后面的下期再查
                                     #   （11-01 彩排：不限名额要查 136 个，40 个时 ② 全部查到、③ 34 个里查到 2 个、爆火 + 潜力 89 个里 32 个；80 个时 ③ 全部）
  material_lookups: 100              # 每期最多查多少个商品的亚马逊 Material 属性（增长商品 + 持续热销对照组优先，再查其余上榜商品；
                                     #   查过的永久缓存，之后每期只查新出现的）
  # 持续热销的月度名单补判（radar/monthly_lists.py）：往月名单每个子类目每月 1 次，近 6 个月一次性约 145 次（之后每月由月度发现带上，不另花），
  # 每期最多补 N 次。销售额前 50 的只用核心刷新做完后剩下的预算（补齐的那一期接着查近 30 天名单，当期就能补判）；
  # 按件数前 50 的（便宜、走量的头部用）在拉日数据之前补，约 145 次一次性。
  # 补齐以后，补判要的当期近 30 天销量用全市场名单；它覆盖不到头部的小子类目（约 12 个）另查近 30 天名单，在拉日数据之前查
  # （以前放在最后用剩下的预算，初筛把预算占满时整期不查，补判用的是好几天前的旧名单）
  monthly_list_calls: 200
  stable_refresh_every: 1            # 每期都刷新全部追踪商品，报告完全反映当期最新情况
  min_interval_seconds: 1.0          # 两次调用之间的最小间隔（卖家精灵有每分钟次数上限）
  rate_limit_wait_seconds: 60        # 被限流（“每分钟访问已达上限”）时等待多久再重试，最多重试 3 次

schedule:
  min_days_between_runs: 7           # 每天检查一次，距上次成功运行满 N 天才真正执行（每周一期，见上面的调用预算）

# ---------------- 判定阈值 ----------------
thresholds:
  stale_days: 2                      # 日数据比本期最新的一天晚超过 N 天 → 标记“数据陈旧”，不判爆火 / 潜力 / 上升中
  # 断货：BSR ≥ 这个值或没有排名的日子（断货 / 停售 / 还没开卖）不算进“之前的水平”（爆火、潜力、上升中的对比期）。
  # 实测：一个上架 6 年的床头柜停售一年（BSR 约 1000 万、销量 0），9 月重新开卖后，对比期一半是 0，被算成“稳在高位”
  out_of_stock_bsr: 1000000
  # 潜力、上升中（和开发方向的增量）的对比期里，连着 ≥N 天销量 0 的日子也算断货：断货头几天 BSR 还没涨到 100 万
  # （实测销量 0 的日子 27% 的 BSR 不到 100 万），会把“之前的水平”拉低。回测（2025-11~2026-09 每周回放，1,687 次增长判定）：
  # 少了 5 次上升中，之后 28 天只有 40% 保持住（其余 84%）。突然爆火不用它：它有自己的“断货恢复”判断，用了反而去掉 3 次之后都保持住的
  out_of_stock_zero_run: 3
  # 评分门槛：不达标的商品不进入任何榜单（爆火 / 潜力 / 热销 / 异常 / 外观分析样本），
  # 也不占追踪名额，由排在后面的商品依次补位。评分优先取最新日数据，没有评论的新品不受限。
  min_rating: 4.0
  # 评论少时几条差评就会跌破 4.0，卖家精灵的评分也比亚马逊晚几天（实测 4.1 分 30 条，亚马逊已是 3.9 分 33 条），
  # 所以评论不到 few_ratings 条的商品，评分要达到 few_ratings_min_rating
  few_ratings: 100
  few_ratings_min_rating: 4.2
  # 对比期（之前 28 天）只算在卖的日子；在卖不到 N 天的（刚开卖、断过货）照样判，卡片上写明“对比期只有 X 天在卖”。
  # 回测（2025-11~2026-09 每周回放）：对比期 1~13 天的潜力之后 28 天 67~72% 保持住、上升中 78~88%，
  # 对比期完整的潜力 74%、上升中 72%，并不更差，所以不排除，只写明。
  # 增量（开发方向、爆火 / 潜力排序）也用它：老品换链接、上架超过 surge.new_listing_max_age_days 天的老链接，之前 28 天在卖不到 N 天的增量按 0
  #（多是断货很久后恢复、销量从老链接转过来；回放 45 周：这样的老链接 6 周进了钉钉的爆火前 3，7 周改变了前 5 个开发方向）
  short_base_days: 14
  # 没超过之前的水平：增长商品现在的水平（突然爆火用近 7/14 天日均，潜力 / 上升中用近 28 天日均）没超过对比期之前 N 天里
  # 卖到过的（连续 28 天、其中在卖 ≥ short_base_days 天的日均最高的一段），是跌下去又涨回来：增量（开发方向、爆火 / 潜力排序）按 0，
  # 卡片和钉钉写明“没超过 X~Y 的水平”，标签不变（例：梳妆台 8 月日均 105 件、9 月 54 件、10 月 97 件，上升中、月增量 $18 万，
  # 一个商品就把梳妆台顶到开发方向第 1）。0 = 不看。
  # 回放 2025-11~2026-09 每周：往前看 56 天，这样的占增长判定的 22%、正增量的 13%，11/45 周改变钉钉的爆火前 3、4/45 周改变开发方向第 1
  #（原型估算：往前看 90 / 120 天是 37% / 44%）；之后 28 天 91% 保持住（其余增长商品 84%），所以不改标签。
  # 取 56 天：大致落在卡片的 90 天走势图里，看报告时能自己核对
  recovery_days: 56
  # 卖家精灵会回头改最近几天的日销量（2026-10-22 隔 2 天重拉 20 个商品：最近 9 天里 75% 被改、中位数是原来的 85%，更早的没变；
  # 用改过的数重判 5 个变了；10-23 那期 386 个商品，最近 9 天 96% 被改、中位数 ×0.82）。每期拿上期存的日数据和这期新拉的比，
  # 测出改了几天、改成原来的几成。revision_mode：
  #   correct（2026-10-27 起）= 把最近这几天按这个幅度校正后再判（卡片上的数、走势图、开发方向的增量都是校正后的；存下的日数据不改，
  #     下期还要拿它测修订）；按当期拉到的数才成立的不上榜，卡片上写明“按当期拉到的数算 X，…校正后不算”。
  #     回测（2025-11~2026-09 每两周回放，按 10-23 实测的 386 个商品各自的修订幅度还原“当期看到的数”，和修订完的数比）：
  #     准确率 突然爆火 70%→86%、潜力 69%→85%、上升中 57%→82%；召回 88%→79%、83%→76%、85%→74%
  #   tag = 按当期拉到的数判，原来成立、校正后不成立的写明，不排除（“最近回落”比回落规则本身）
  # correct 还要当期拉到的数最近几天确实偏高才校正：全部追踪商品“最近 N 天日均 ÷ 再之前 18 天”的中位数，比同一批商品 14 天前那个截面
  # 高出测到的修订对应的偏高（×0.82 → ×1.22）的 revision_inflation_share 以上（×0.82 时要 ≥ ×1.11）。测到的修订说的是上期拉到的数被下调了，
  # 不一定这期的也会：实测修订前那次（10-20，倒推）×1.17，修订后那次（10-22）×0.93——那次很可能是一次性的重新估算，再拿 0.82 去校正 10-22 拉的数
  # 会凭空造出“下台阶”。不偏高时按拉到的数判，也不标“还会被改”。上面的回测是在“当期确实偏高”的前提下做的
  # 测到的商品不到 N 个、或幅度不到 M 时都不校正
  revision_mode: correct
  revision_inflation_share: 0.5
  revision_min_items: 30
  revision_min_change: 0.02
  surge:                             # 突然爆火
    windows: [7, 14]                 # 近 N 天 vs 之前 28 天
    base_days: 28
    bsr_ratio: 0.5                   # 近期 BSR 中位数 ≤ 之前的 0.5 倍（排名翻倍提升）
    sales_ratio: 2.0                 # 近期日均销量 ≥ 之前的 2 倍
    min_daily_sales: 3               # 近期日均销量下限（过滤小基数噪声）
    # 形态（依次判断；都不符合的不算爆火）：
    #   新品爆发：之前 28 天日均 < 0.5 件
    #   （短时脉冲：近 7 天的增量 ≥60% 来自 ≤2 天 —— 不算爆火）
    #   稳在高位：近 7 天里 ≥5 天达到之前水平的 1.5 倍，且最近 3 天日均与近 7 天相差 ≤15%
    #   仍在上涨：近 7 天日均比前 7 天高 ≥15%，且最近 3 天日均高于近 7 天
    sustained_mult: 1.5
    sustained_days: 5
    steady_band: 0.15
    climb_ratio: 1.15
    pulse_share: 0.6
    price_drop: 0.15                 # 价格中位数下降 ≥15% → 降价驱动
    restock_ratio: 0.5               # 对比窗口多数天无销量、且更早时日均 ≥ 现在的 0.5 倍 → 断货恢复（不算爆火）
    new_listing_min_daily: 30        # 新品从零起量要算“爆火”：日均 ≥ 30 件，
    new_listing_node_share: 0.25     #   且 ≥ 所在子类目 Top20 水平日均的 25%；不够的只标“新品起量”
    # 从零起量的只有上架 ≤ N 天的叫“新品爆发 / 新品起量”；更老的叫“老链接重新起量”（停了很久又开始卖，不是新品），
    # 门槛一样，照常算爆火。回测：上架超过 1 年却被叫成新品的有 11 个商品、18 次（例：上架 559 天、之前停了 115 天）；
    # 它们之后 28 天 61% 保持住，和真新品的 65% 差不多，所以只改名字、不排除
    new_listing_max_age_days: 180
  hot:                               # 真正持续热销
    rank_in_node: 20                 # “达到该子类目 Top20 的月销量水平”：按月销量排名（月度发现时每个子类目另取月销量前 50，
                                     #   只在销售额前 50 里排会偏低：床头柜低 34%、五斗柜低 13%）
    lookback_months: 4
    months_required: 3               # 近 4 个月中 ≥3 个月达到
    max_cv: 0.35                     # 近 6 个月销量波动系数上限
    min_trend: -0.15                 # 近 3 个月月均变化不低于 -15%（真实数据月度波动较大）
    min_recent_ratio: 0.7            # 近 28 天日均 ≥ 近 6 个月日均的 0.7 倍（没有掉下来）
    # 达标的月份还要量够：这个月 ≥ min_units 件或销售额 ≥ min_revenue 美元。小子类目的第 20 名可能一个月只卖几件
    # （实测“五斗柜、文件柜”“十抽文件柜”门槛为 0，日均 1.6 件的商品成了持续热销）。
    # 回测：用机会候选的 300 件 / 4 万美元会去掉 3 个每天卖十几件、之后 96% 保持住的商品；150 件 / 2 万美元过去 11 个月一个没去掉
    min_units: 150
    min_revenue: 20000
    # 不在追踪池里的商品也判（月度名单补判）：追踪池约 470 个，月度名单里够得上第 20 名水平的约 540 个里约 380 个不在池子里，
    # 原来不可能被判持续热销。近 list_months 个月每个月都在子类目销售额前 50 或月销量前 50（往月名单两份都看：便宜、走量的头部
    # 进不了销售额前 50。回测：2026-09 至少 94 个这样的头部、25 个达标，6 月判出的之后两个月保持住 83%，销售额前 50 里的 89%）、
    # 本期有它近 30 天销量的（当期的全市场名单；
    # 小子类目的头部量不够全市场门槛，另查它的近 30 天名单），按同样的条件判，近 28 天日均用近 30 天的销量 ÷ 30；
    # 不是当期的数不用。没有日数据，所以没有走势图、不判回落，卡片上标“只有月度数据”
    list_months: 6
    # 持续热销正在回落的（回落规则见下面 momentum）标“最近回落”，不影响上榜。回测：这样的之后 28 天
    # 61% 保持在近 28 天水平的 80% 以上，没回落的 85%
  # 数据本身可能有问题的，卡片上写明（不影响上榜，见 analyze.data_tags）：
  #   变体变多：增长商品的变体数比约一个月前多了 ≥ var_jump（且 ≥ var_min 个）——增长里可能有新挂进来的变体的销量
  #     （10-23 全覆盖试跑：同一 ASIN 9 月名单和 10-23 名单比，537 个里 24 个变体多了三成以上，其中 3 个是增长商品）；
  #   名单和日数据对不上：名单近 30 天销量和日数据最近 30 天合计差 ≥ mismatch 倍（两边都 ≥ mismatch_min 件；试跑 0.4% 的商品这样）；
  #   日数据有缺：最近 28 天 ≥ gap_days 天没有日数据（试跑 1.6% 的商品）
  data_checks:
    var_jump: 0.3
    var_min: 2
    mismatch: 2.0
    mismatch_min: 60
    gap_days: 7
  # 品类大盘（radar/universe.py node_tide）：每个子类目里量够的商品近 30 天销量是约 30 天前的几倍，取中位数（扣大促日）。
  # 突然爆火、潜力、上升中的增长倍数先除以它（大于 1 时）再比门槛：整个子类目一起涨时随大流的不算（标“随大盘”）；从零起量的爆火没有倍数，不扣。
  # 突然爆火（2026-10-27 起）：以前以为 BSR 排名本来就是和市场比的，但 12 月整个子类目的排名会一起往上走。回测（每周回放，1,778 次突然爆火）：
  # 去掉 14%，去掉的之后 28 天 78% 保持住、留下的 88%；12 月 60% / 77%。
  # 潜力 / 上升中：
  # 回测（2025-11~2026-09 每周回放，1,183 次潜力 / 上升中）：去掉 21%，之后 28 天保持住的比例 潜力 74%（其余 86%）、上升中 79%（其余 81%），
  # 12 月 68%（其余 66%）——是定义上的要求（跑赢自己的品类），不是预测更准。回测用的是追踪商品算的大盘（偏高），线上用全市场名单
  tide:
    enabled: true
    min_items: 10                    # 子类目里能算的商品不到 N 个不算大盘
    max: 2.0                         # 最多按 N 倍扣
    # 每个商品的倍数换算成 span_days 天的跨度（倍数 ^ (span_days ÷ 基准有几天)），和上升中 / 潜力的“近 28 天 vs 再之前 28 天”一致。
    # 头一个月的基准是上个月的月度名单，11-08、11-15 那两期是 39、46 天前；中间有一期没跑成时用 35 天前的快照。
    # 去年同期的日数据：涨得最多的子类目 46 天 ×1.57，折成 28 天 ×1.32（不换算时它的上升中门槛是 2.04 倍，换算后 1.72 倍）。0 = 不换算
    span_days: 28
  rising:                            # 上升中：不够“突然爆火”但近 28 天明显在涨，一起纳入外观分析
    min_ratio: 1.3                   # 近 28 天日均 ≥ 再之前 28 天的 1.3 倍；近 7 天（不是大促日的 7 天）日均也要 ≥ 1.3 倍
    # 近 7 天这一条（潜力同样，用 potential.min_recent_ratio）：只比 28 天时，涨幅在前半段、最近已回到原来水平的也达标。
    # 回放 2025-11~2026-09 每周：上升中去掉 217 / 2,051、潜力 28 / 308，去掉的之后 28 天仍在对比期 × 同一倍数以上的 44~46%（留下的 79~88%）
    min_daily_sales: 3
  # 回落：突然爆火、潜力、上升中都要求没有回落，否则标“最近回落”、不上榜。
  # 只比 28 天或月环比，会被刚开卖时的从零起量撑高；只数“近 7 天几天达标”，冲高后在往下掉的也会被当成持续。
  momentum:
    # 回落 = 任一：① 冲高后正在往下掉：最近 3 天日均 < 近 4 周里最高的 3 天日均 × min_vs_peak_3d，且 < 再之前 3 天日均 × min_vs_prev_3d；
    #             ② 这一周整体变低：近 7 天销量的中位数 < 再之前 7 天的中位数 × min_vs_prev_week；
    #             ③ 冲高后连着往下掉：近 7 天最高那天之后、直到最近一天都没回升（≥slide_days 天），且最近一天 ≤ 最高那天 × slide_max_vs_peak。
    # 回测（400 天日数据、3343 次增长商品判定，看之后两周）：旧规则（近 7 天比最高一周低 20% 或最近 3 天比近 7 天低 20%）
    # 标出的回落只有 25% 之后真跌了、53% 其实稳住或继续涨，真跌的漏掉 59%；这个规则是 30% / 47%，漏掉 49%
    min_vs_peak_3d: 0.75
    min_vs_prev_3d: 0.9
    min_vs_prev_week: 0.85
    slide_days: 3
    slide_max_vs_peak: 0.7
  # 大促日：这些天的日数据不参与爆火 / 潜力 / 上升中 / 回落 / 持续热销的比较。
  # 实测：2025-10-07/08 七成商品、2026-06-23~26 六成商品当天销量翻倍，第二天就回到原样；不去掉的话，
  # 大促刚过时冒出一批“上升中”，之后两三周每期有 12~26 个商品被误判为“最近回落”（平时约 3 个，去掉大促日后 3~8 个）。
  # 来源：下面 deal_windows 登记的日期 + 自动识别（某天 ≥core_share 的商品当天销量达到自己前 base_days 天中位数的 jump 倍；
  # 只看中位数 ≥min_base_daily 件的商品，且这样的商品 ≥min_items 个；相连的、比例 ≥edge_share 的日子也算）。平时这个比例约 4%，最高约 26%
  events:
    auto: true
    jump: 1.8
    core_share: 0.3
    edge_share: 0.15
    base_days: 14
    min_base_daily: 3
    min_items: 40
    # 大促后数据待修订（只提示，不改判定）：卖家精灵刚拉到的最近约 10 天销量像是按当天排名换算的，大约一周后才修订
    # （排名基本不改，销量八成以上被改）。大促后排名会好上一周左右，换算出来的销量成了“冲上去后走平”，像稳在高位，
    # 大促日也认不出来：Prime Big Deal Days（10-06~10-08）后 10-10 / 10-13 / 10-14 拉到的数据里 10-06/07 冲高的商品只有 1~4%
    # （10-20 修订后 26% / 49%）。10-14 那期按当时的数据判的 47 个增长里 16 个（爆火 10 个里 6 个）修订后不成立；
    # 按商品改判都更差（去掉那几天：判错 16 → 22；要求大促前就在涨：判错 8 但漏掉 5 → 20，去掉的和留下的判错比例一样），所以只提示。
    # 条件：近 lift_lookback 天里有连续 ≥ lift_min_days 天，平时在卖的商品（前 base_days 天 BSR 中位数 ≤ lift_max_bsr）里
    # ≥ lift_share 的排名好到自己前 base_days 天中位数的 1/jump 以下（平时中位数 4%，95% 的日子 <10.6%；
    # 回放 2025-09~2026-10 每周六：57 周里 9 周会提示（2025-10-11/18、12-06、2026-01-03/10、06-27、07-04、10-10/17；黑五当周排名动得少，2025-11-29 那期不提示），都是大促或圣诞后的一两周）
    lift_share: 0.10
    lift_min_days: 2
    lift_lookback: 10
    lift_max_bsr: 300000
  potential:                         # 潜力
    min_age_days: 30
    max_age_days: 180
    min_monthly_growth: 0.15         # 完整月份的月销量环比增长 ≥15%
    min_recent_ratio: 1.2            # 近 28 天日均 ≥ 再之前 28 天日均的 1.2 倍；近 7 天（不是大促日的 7 天）日均也要 ≥ 1.2 倍
    max_ratings: 300                 # 评分要求见上面的 min_rating
    min_daily_sales: 2
  fake:                              # 假爆火 / 异常信号评分
    suspect_score: 3                 # ≥3 分：疑似
    high_score: 5                    # ≥5 分：高度疑似
    review_rate_mult: 3              # 留评率 ≥ 子类目中位数的 3 倍
    review_rate_floor: 6             # 且 ≥ 6%
    min_new_reviews: 10
    new_listing_days: 90
    new_listing_review_ratio: 0.10   # 新品累计评论数 / 累计销量 ≥ 10%
    run_review_ratio: 0.15           # 两期之间新增评论 / 新增销量 ≥ 15%
    # 两期之间的评论增速和之前 N 天里记到的最高评论数比：卖家精灵的评论数会来回跳（线上 10-08~10-23 相邻两期 5% 是往下掉的，
    # 1231 → 1189 → 1195 → 1237 这样跌了又涨回来的，和上一期比成了“+42 条”）。回测（线上 10-08~10-23 的观测）：标出的 33 个去掉 8 个这样的。
    # 上架 ≤ vine_days 天、没抽查过评论的，累计前 vine_allowance 条里新增的当作可能是 Vine；和留评率、新品评论比同时成立时只计 1 分（同一个证据）
    review_base_days: 45
    # 评论数和销量都是整个父体的，变体多少都直接比、不除以变体数（10-23 全覆盖试跑 7,536 个商品：留评率中位数按变体数
    # 1 / 2~3 / 4~6 / 7~15 / 16+ 个是 1.7% / 3.2% / 3.0% / 2.8% / 2.3%，名单销量 ÷ 日数据各档都是 1.00~1.05；
    # 以前先除以变体数，4 个以上变体的留评率信号 208 个只剩 19 个）
    rating_jump: 0.2
    rating_jump_min_ratings: 50
    pulse_mult: 3                    # 1~3 天冲到基线 3 倍后迅速回落
    pulse_min_sales: 6
    pulse_revert: 1.3
    merge_jump: 0.3                  # 评论数暴增 ≥30% 且父体/变体变化 → 变体合并
    review_burst_share: 0.3          # 评论集中：评论最多的 3 天 ≥30%，
    review_burst_quantile: 0.99      #   且比随机分布时 3 天最多的条数（这个分位）还多。评论接口一页只给最新 20 条，按这一页覆盖的天数比
    unverified_share: 0.5            # 非验证购买评论占比
    # Vine（亚马逊给新品安排的测评，每个商品最多 30 条，都在上架头几个月）：没抽查过评论的、上架 ≤ vine_days 天的新品，
    # 前 vine_allowance 条评论当作可能是 Vine，不算进留评率和新品评论/销量比（抽查过的按抽到的 Vine 比例扣）。
    # 实测 10-23 全覆盖试跑：8 个异常商品里 3 个只有 28~48 条评论，扣掉后都不到门槛，其余 5 个照样是异常
    vine_allowance: 30
    vine_days: 90

  # 外观与工艺依据：增长商品“更多”的特征怎么算（报告里的说明直接取这些数字）
  appearance:
    min_count: 2                     # 至少几个增长商品有，这条依据才算数
    min_brands: 2                    #   且来自至少几个品牌（同一卖家的几条链接不能单独撑起一个趋势）
    title_min_share: 0.1             # 标题统计：增长商品里占比 ≥10%
    title_min_lift: 1.3              #   且是全部头部商品的 1.3 倍以上
    image_min_gap: 0.1               # 主图识别：比持续热销对照组多 10 个百分点以上（对照组 40 个，即至少多 4 个）
    common_share: 0.3                # “常见”：增长商品里 ≥30% 有、但不比对照组多
    also_share: 0.1                  # “也有”：增长商品里 ≥10%、不到 30% 有、但不比对照组多（只说明有人在做，不代表趋势）
    # 颜色有主图识别时只看主图（标题里的颜色常是把可选变体都列出来），见 radar/detect/design.py 的 IMAGE_FIRST_DIMENSIONS
    per_dim: 6                       # 每个维度最多列几个“更多”的特征
  directions:                        # 开发方向：增长商品带来的增量销售额最大的几个子类目，各写一个产品画像
    min_items: 2                     # 子类目里至少几个增长商品
    min_brands: 2                    #   且来自至少几个品牌；下面的特征比例也按品牌算（同一品牌的多个商品只算一次）
    max: 0                           # 报告里最多列几个方向，0 = 够格的全部列出（按增量销售额 =（近 28 天日均 − 之前 28 天日均）× 售价 × 30
                                     #   的合计排序。只按品牌数排时，便宜、门槛低的品类排前面：实测 $35 的衣帽架排第一，$138 的梳妆台进不了前 5）。
                                     #   以前只列前 5 个：10-23 够格的 12 个子类目、前 5 个只占增长商品增量的 70%；
                                     #   11-01 彩排（全市场名单初筛后）够格的 24 个、前 5 个只占 53%
    summary_max: 5                   # 本期要点和钉钉消息里只写增量最大的前几个（全部的在报告“开发方向依据”里）
    feature_min_share: 0.5           # 基本款 / 主材质：该子类目至少一半（且不少于 2 个）品牌具备
    per_dim: 3                       # 每个维度每一档最多列几个特征
    # 比头部多：增长商品里具备的品牌占比，比同子类目头部商品里的占比高 head_min_gap 以上、是它的 head_min_lift 倍以上（且 ≥2 个品牌）。
    # 只看增长商品自己“一半以上都有”，列出来的多是品类本来就有的（衣帽架“带挂钩 8/8”、书架“开放格 5/5”）
    head_max: 30                     # 同子类目头部商品：月度名单里这个子类目、不在增长商品里的，按月销量取前 N 个
    head_min: 10                     #   少于 N 个时不对比；有主图识别的 ≥N 个时两边都看主图，否则两边都只看标题
    head_min_gap: 0.2
    head_min_lift: 1.5               # 只看差距时，4 个品牌全有、头部 73% 有的“带抽屉”也会算“比头部多”
  # 老品换链接：新子体挂进老父体（或老品换了新 ASIN），继承了评论和排名，上架天数不代表商品是新的。
  # 实测：上架 ≤60 天、日均 ≥5 件却不在任何增长板块的 36 个商品里 33 个是这样（例：上架 47 天、第 1 天就卖 134 件、已有 2315 条评论）。
  # 老品换链接 = 上架 ≤ max_age_days 天，且 评论数 ≥ 自己累计销量的 review_share，
  #             或 评论数 ≥ 累计销量的 review_share_fast 且 第一周（从第一天卖出东西算起）日均 ≥ 近 7 天日均的 fast_share（且 ≥ fast_min_daily 件）。
  # 正常留评率 1~3%，Vine 计划最多 30 条；只“第一周就卖得多”、评论正常的多是大卖家投广告推的真新品，不算。
  # 这类商品不算潜力、新品爆发、新品起量，不计“新品评论/销量比”异常分；开发方向里它之前 28 天没在卖（或在卖不到 short_base_days 天）时增量按 0
  relist:
    max_age_days: 180
    review_share: 0.5
    review_share_fast: 0.15
    fast_share: 0.5
    fast_min_daily: 5
    # 或“一步跳到满速”：第一个达到 max(fast_min_daily, 近 7 天日均 × fast_share) 的日子起 7 天日均也达到，而它之前 7 天日均 ≤ 那 7 天的 step_pre_share
    # （开卖头几天每天零星卖一两件、几周后一下子跳到满速，按“第一周”只有一两件；实测上架 57 天、339 条评论，前 6 天每天 1 件，之后每天 149 件）。
    # 回测（10-23 全覆盖试跑里上架 ≤180 天的 1,840 个）：多认出 3 个，评论 236~342 条；只把“第一周”改成从第一个日销 ≥5 件的日子算会多认出 38 个，
    # 大多是评论正常的小新品。另外，抽查评论看到近 60 天的评论不到应有的一半（评论是继承来的）、且评论 ≥ 累计销量的 review_share_fast 的，也算
    step_pre_share: 0.1
    # 对比期还包括它开卖的第一周（ramp_days 天）的爆火 / 上升中，标“对比期包括它开卖的第一周”：起量里可能有老链接转过来的流量。
    # 只标注、不排除。回测：这样的爆火 / 上升中 之后 28 天 84% 保持住（其他增长商品 71%），排除会拿掉 101 个之后照样卖得好的商品
    ramp_days: 7

# 大促日期（美国时间）：这些天的日数据不参与比较（见 thresholds.events），落在这些天的脉冲不计入异常分。
# 大促日只从卖家精灵的日数据里认：这里登记的只用来给认出来的日子起名字，数据里那天也有 ≥edge_share 的商品冲高时补上；
# 数据看不出来的日子不按登记的算
# （2026-10-14 拉到的数据里 10-06/07 冲高的商品不到 6%，没认；到 10-20 卖家精灵修订了这几天的日数据，变成 26% / 49%，
# 就认成了大促日：卖家精灵最近几天的日数据会回头修订，所以每期都按当期拉到的数据重新认）。
# Prime Day / Prime 大促日 每年日期不同，公布后可以在此补充（只影响名字）
deal_windows:
  - {name: Prime Big Deal Days, start: "2026-10-06", end: "2026-10-07"}
  - {name: 黑五网一, start: "2026-11-27", end: "2026-12-01"}
  - {name: 黑五网一, start: "2027-11-26", end: "2027-11-30"}

# ---------------- 报告 ----------------
report:
  title: 家具爆品雷达
  subtitle: 亚马逊美国站 · 板材 / 实木 / 铁木家具
  base_url: ""                       # 留空自动推导为 https://<用户名>.github.io/<仓库名>/（本地运行取 git 的 origin 地址）
  keep_reports: 60                   # 网站上保留最近 N 期报告
  top_n: 0                           # 每个板块的小窗里最多列出多少个商品，0 = 全部列出（顶部数字和小窗里的个数一致）
  # 空报告保护：计划刷新的日数据只拉到不到这个比例（或一个都没拉到）时不出这一期（钉钉发失败告警，已拉到的照样保存）。以往每期 ≥98%
  min_refresh_share: 0.6

# ---------------- 钉钉 ----------------
notify:
  open_in_browser: true              # PC 端点击后用系统浏览器打开（手机端仍在钉钉内打开）
  at_all: false
  max_items: 3                       # 消息里每类列出前 N 个

# ---------------- 文字总结（可选） ----------------
llm:
  enabled: auto                      # auto = 有 DEEPSEEK_API_KEY 才启用
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro
  api_key_env: DEEPSEEK_API_KEY
  timeout_seconds: 120
  extra_body:                        # 非 DeepSeek 接口可删除此项
    thinking: {type: disabled}
  # 主图外观识别：用视觉模型读增长商品（突然爆火 + 潜力 + 上升中）的主图（风格、材质、造型、工艺、颜色、看得见的功能和一句外观要点），
  # 约 300 tokens/张，结果会缓存。材质标签只用来补全“主材质”
  vision: auto                       # auto = 有 key 才启用；false = 关闭
  vision_model: deepseek-v4-flash-vision-exp
  vision_focus: 50                   # 识别增长商品里势头最强的 N 个（识别过的缓存，之后只识别新商品）
  vision_reference: 40               # 持续热销对照组：不在增长商品里的、月销量最高的 N 个（主图识别和主材质都和它比；20 个时一个商品就是 5 个百分点，太敏感）
