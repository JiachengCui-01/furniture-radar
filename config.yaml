# 家具爆品雷达 配置文件
# 这里只放“非机密”的参数，密钥一律放环境变量 / GitHub Secrets（见 .env.example）。
# 没写的项会使用 radar/config.py 里的默认值。

marketplace: US
vendor_timezone: America/Los_Angeles   # 卖家精灵按美国时间结算月份
display_timezone: Asia/Shanghai        # 报告里显示的时间

# ---------------- 监控范围 ----------------
# 只看板材 / 实木 / 铁木为主的柜类、桌类、床架、置物架；
# 剔除沙发、床垫、脚凳、各类椅子、天篷、屏风、塑料折叠桌，以及软包 / 布艺抽屉 / 塑料商品。
scope:
  # 根类目：会自动展开出子类目，并在每个子类目里取头部商品
  roots:
    - path: "1055398:1063306"        # Home & Kitchen > Furniture
      label: 家具
    - path: "1064954:1069102"        # Office Products > Office Furniture & Lighting（书桌、置物架、文件柜等）
      label: 办公家具
  rollup_pages: 2                    # 子类目按销售额取前 N×50 个（范围收窄后需要看得更深）
  min_node_products: 800             # 子类目商品数低于此值不单独追踪
  max_nodes: 30                      # 最多追踪多少个子类目
  # 子类目自己的英文名（最后一级）要匹配“保留”且不匹配“剔除”才会追踪
  include_label_regex: '(?i)\bbeds?\b|bed frames?|headboard|desk|workstation|dresser|\bchests?\b|bookcase|shel(f|ves|ving)|nightstand|night stand|tables?\b|console|\btv\b|media|entertainment|cabinet|storage|pantr|buffet|sideboard|credenza|hutch|vanit|bench|rack|island|armoire|wardrobe|shoe|hall tree|filing|etagere'
  exclude_label_regex: '(?i)sofas|couch|loveseat|sectional|futon|mattress|box spring|ottoman|bean bag|chair|stool|recliner|seating|canop|gazebo|pergola|tent|divider|screen|folding|adjustable base|massage|inflatable|air bed|light|lamp|umbrella|cushion|pillow|cover|replacement|parts|hardware|decor|cart|display|laborator|science'
  # 商品标题匹配下面的词直接剔除（软包、布艺抽屉、塑料等）
  exclude_product_regex: '(?i)upholster|tufted headboard|fabric (?:drawers?|bins?|storage|dresser|chest)|\bplastic\b|\bresin\b|folding bed|rollaway|mattress set|& mattress|with (?:memory foam |foam |a )?mattress\b'
  # 额外固定追踪的类目（用 python -m radar search-category 关键词 查 nodeIdPath）
  extra_nodes: []
  #  - path: "1055398:1063306:1063318:3733551"
  #    label: 沙发

# ---------------- 发现 ----------------
# 卖家精灵的商品榜单有两种：传月份 = 已结束月份的月末快照（月度名单，每月查一次）；
# 不传月份 = 截至当天的近 30 天数据（近 30 天榜单，每期刷新）。
discovery:
  top_per_node: 50                   # 每个子类目取多少个头部商品
  order_field: total_amount          # 头部排序字段（total_amount=销售额）
  merge_variations: true             # 同一父体只取一条（不合并时头部 50 名常常只有 1~5 个不同商品）
  newcomer_max_nodes: 12             # 在销量最大的 N 个子类目里额外查新品
  newcomers_per_node: 30
  newcomer_min_revenue: 20000        # 新品月销售额门槛（美元，近 30 天新品榜也用它）
  # 近 30 天榜单（每期刷新，每期约 6 次调用）：每个根类目按“销量增长率”“近 7 天 BSR 增长率”各取前 N，
  # 再按上架时间倒序取销售额达标的新品。覆盖头部 50 名以外、最近才起量的商品；最终是否爆火由日数据判定。
  risers_per_root: 50                # 0 = 关闭
  risers_new_per_root: 50            # 新品榜，0 = 关闭
  risers_min_units: 300              # 近 30 天销量下限，过滤小基数的排名跳动
  risers_orders: [total_units_growth, bsr_rank_cr]
  risers_max_prev_bsr: 1000000       # 之前 BSR 高于此值的多为断货恢复，剔除
  # 相似款：上期爆火/潜力商品里取前 N 个作种子，查同类竞品（每个 1 次调用，返回约 15 个近 30 天数据的商品）
  similar_seeds: 3
  similar_size: 20
  similar_cooldown_runs: 3           # 同一种子 N 期内不重复查；查到的相似款保留 N 期作为候选

# ---------------- 追踪池（每个商品每期 1 次调用拉日数据） ----------------
# 按顺序填满：必看 → 相似款 → 机会候选。同一父体只取一个，评分不达标的不占名额，由后面的依次补位。
# 池子大小还会受本期剩余预算限制。
pool:
  max_size: 155
  core_max: 80                       # 必看名额：往期爆火/潜力/异常 + 每个子类目月销量前 N，
  per_node_top: 1                    #   还有剩就按月销量从全部子类目里补（持续热销板块的大卖家不会漏）
  watch_runs: 3                      # 被标为爆火/潜力/异常的 ASIN 继续必看的期数
  similar_max: 10                    # 相似款名额
  # 机会候选 = 近 30 天上升榜 / 新品榜 / 相似款，加上月度名单里增长快或上架半年内的商品，按机会分排序：
  opportunity_every_run: 20          # 机会分最高的 N 个每期都看，其余按“最久没查”轮流查
  opportunity_min_units: 300         # 月销量（或近 30 天销量）下限
  opportunity_min_growth: 20         # 月度名单里：销量增长 ≥ N%
  opportunity_max_age_days: 180      #   或上架不超过 N 天

# ---------------- 卖家精灵调用预算 ----------------
budget:
  per_run: 175                       # 每期调用上限（近 30 天榜单 ~6 + 相似款 ~3 + 追踪池约 145 + 核查 / 材质）
  bootstrap_run: 230                 # 需要重新发现子类目的那一期（首期 / 换范围 / 每月初）
  monthly_cap: 1800                  # 每月总上限
  review_checks: 5                   # 每期对可疑商品做评论核查的个数（每个 1~2 次调用）
  material_lookups: 15               # 每期最多查多少个商品的亚马逊 Material 属性（查过的永久缓存，之后每期只查新商品）
  stable_refresh_every: 1            # 每期都刷新全部追踪商品，报告完全反映当期最新情况
  min_interval_seconds: 1.0          # 两次调用之间的最小间隔（卖家精灵有每分钟次数上限）
  rate_limit_wait_seconds: 60        # 被限流（“每分钟访问已达上限”）时等待多久再重试，最多重试 3 次

schedule:
  min_days_between_runs: 3           # 每天检查一次，距上次成功运行满 N 天才真正执行

# ---------------- 判定阈值 ----------------
thresholds:
  stale_days: 4                      # 日数据超过 N 天没更新 → 标记“数据陈旧”
  # 评分门槛：评分低于此值的商品不进入任何榜单（爆火 / 潜力 / 热销 / 异常 / 外观分析样本），
  # 也不占追踪名额，由排在后面的商品依次补位。评分优先取最新日数据，没有评论的新品不受限。
  min_rating: 4.0
  surge:                             # 突然爆火
    windows: [7, 14]                 # 近 N 天 vs 之前 28 天
    base_days: 28
    bsr_ratio: 0.5                   # 近期 BSR 中位数 ≤ 之前的 0.5 倍（排名翻倍提升）
    sales_ratio: 2.0                 # 近期日均销量 ≥ 之前的 2 倍
    min_daily_sales: 3               # 近期日均销量下限（过滤小基数噪声）
    sustained_mult: 1.5              # “持续型”：近 7 天里 ≥5 天达到基线的 1.5 倍
    sustained_days: 5
    pulse_share: 0.6                 # “脉冲型”：≤2 天贡献了 ≥60% 的增量
    seasonal_ratio: 1.5              # 去年同期也涨了 ≥1.5 倍 → 季节性
    price_drop: 0.15                 # 价格中位数下降 ≥15% → 降价驱动
    restock_ratio: 0.5               # 对比窗口多数天无销量、且更早时日均 ≥ 现在的 0.5 倍 → 断货恢复（不算爆火）
    new_listing_min_daily: 30        # 新品从零起量要算“爆火”：日均 ≥ 30 件，
    new_listing_node_share: 0.25     #   且 ≥ 所在子类目 Top20 水平日均的 25%；不够的只标“新品起量”
  hot:                               # 真正持续热销
    rank_in_node: 20                 # “达到该子类目 Top20 的月销量水平”
    lookback_months: 4
    months_required: 3               # 近 4 个月中 ≥3 个月达到
    max_cv: 0.35                     # 近 6 个月销量波动系数上限
    min_trend: -0.15                 # 近 3 个月月均变化不低于 -15%（真实数据月度波动较大）
    min_recent_ratio: 0.7            # 近 28 天日均 ≥ 近 6 个月日均的 0.7 倍（没有掉下来）
  rising:                            # 上升中：不够“突然爆火”但近 28 天明显在涨，一起纳入外观分析
    min_ratio: 1.3                   # 近 28 天日均 ≥ 再之前 28 天的 1.3 倍
    min_daily_sales: 3
  potential:                         # 潜力
    min_age_days: 30
    max_age_days: 180
    min_monthly_growth: 0.15         # 完整月份的月销量环比增长 ≥15%
    min_recent_ratio: 1.2            # 近 28 天日均 ≥ 再之前 28 天日均的 1.2 倍
    max_ratings: 300                 # 评分要求见上面的 min_rating
    min_daily_sales: 2
  fake:                              # 假爆火 / 异常信号评分
    suspect_score: 3                 # ≥3 分：疑似
    high_score: 5                    # ≥5 分：高度疑似
    review_rate_mult: 3              # 留评率 ≥ 子类目中位数的 3 倍
    review_rate_floor: 6             # 且 ≥ 6%
    min_new_reviews: 10
    new_listing_days: 90
    new_listing_review_ratio: 0.10   # 新品累计评论数 / 累计销量 ≥ 10%
    run_review_ratio: 0.15           # 两期之间新增评论 / 新增销量 ≥ 15%
    max_variations_for_ratio: 3      # 变体多于此数时评论是父体共享的，不做评论/销量比
    rating_jump: 0.2
    rating_jump_min_ratings: 50
    pulse_mult: 3                    # 1~3 天冲到基线 3 倍后迅速回落
    pulse_min_sales: 6
    pulse_revert: 1.3
    merge_jump: 0.3                  # 评论数暴增 ≥30% 且父体/变体变化 → 变体合并
    review_burst_share: 0.3          # 近 60 天评论 ≥30% 集中在 3 天
    unverified_share: 0.5            # 非验证购买评论占比

# 大促窗口：落在窗口内的暴涨会标注“大促”，脉冲不计入假爆火分
deal_windows:
  - {name: 黑五网一, start: "2026-11-27", end: "2026-12-01"}
  - {name: 黑五网一, start: "2027-11-26", end: "2027-11-30"}
  # Prime Day / Prime 大促日 每年日期不同，公布后请在此补充，例如：
  # - {name: Prime Big Deal Days, start: "2026-10-07", end: "2026-10-08"}

# ---------------- 报告 ----------------
report:
  title: 家具爆品雷达
  subtitle: 亚马逊美国站 · 板材 / 实木 / 铁木家具
  base_url: ""                       # 留空自动推导为 https://<用户名>.github.io/<仓库名>/
  keep_reports: 60                   # 网站上保留最近 N 期报告
  top_n: 15                          # 每个板块最多展示多少个商品

# ---------------- 钉钉 ----------------
notify:
  open_in_browser: true              # PC 端点击后用系统浏览器打开（手机端仍在钉钉内打开）
  at_all: false
  max_items: 3                       # 消息里每类列出前 N 个

# ---------------- 文字总结（可选） ----------------
llm:
  enabled: auto                      # auto = 有 DEEPSEEK_API_KEY 才启用
  base_url: https://api.deepseek.com
  model: deepseek-v4-pro
  api_key_env: DEEPSEEK_API_KEY
  timeout_seconds: 120
  extra_body:                        # 非 DeepSeek 接口可删除此项
    thinking: {type: disabled}
  # 主图外观识别：用视觉模型读爆火/潜力商品的主图（风格、材质、造型、工艺、颜色），约 300 tokens/张，结果会缓存
  vision: auto                       # auto = 有 key 才启用；false = 关闭
  vision_model: deepseek-v4-flash-vision-exp
  vision_focus: 20                   # 识别多少个爆火/潜力/上升中商品
  vision_reference: 10               # 再识别多少个持续热销商品作对照
